name: Maven Release

on:
  workflow_call:
    inputs:
      dryRun:
        description: "Should the maven release plugin do a dry run"
        type: boolean
        default: true
      releaseVersion:
        description: "The release version for the artifact"
        type: string
        required: true
      developmentVersion:
        description: "The new development version for the artifact"
        type: string
        required: true

jobs:
  maven-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: 'github'
      # The global git credential helper below lets the fresh clone that release:perform makes in target/checkout authenticate to the private repo, because the credentials from actions/checkout only apply to the original .git directory.
      - name: Setup Git User
        run: |
          git config user.name "LTS Bot"
          git config user.email "lts-devs@virginia.edu"
          cat > "$RUNNER_TEMP/git-credential-token" <<'EOF'
          #!/bin/sh
          echo "username=x-access-token"
          echo "password=${GITHUB_TOKEN}"
          EOF
          chmod +x "$RUNNER_TEMP/git-credential-token"
          git config --global credential.https://github.com.helper "$RUNNER_TEMP/git-credential-token"
      # Fails the job early, before release:prepare creates any tags or commits, if git can't authenticate to the caller's repo from a fresh clone, which is the same situation as release:perform's clone into target/checkout.
      - name: Verify git auth in a fresh clone
        run: git clone --depth 1 "https://github.com/$GITHUB_REPOSITORY" "$RUNNER_TEMP/auth-test"
        env:
          GITHUB_TOKEN: ${{secrets.DEPLOY_GITHUB_TOKEN}}
      - name: Release
        run: mvn --batch-mode clean release:prepare release:perform -DscmShallowClone=false -DdryRun=${{inputs.dryRun}} -DreleaseVersion=${{inputs.releaseVersion}} -DdevelopmentVersion=${{inputs.developmentVersion}}
        env:
          GITHUB_TOKEN: ${{secrets.DEPLOY_GITHUB_TOKEN}}

